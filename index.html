
<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f6f1">
<meta name="description" content="متابعة الصلاة بطريقة بسيطة">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>متابعة الصلاة</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#f5f6f1;color:#405348;font-family:Arial,"Noto Sans Arabic",sans-serif}
body{min-height:100vh}
.app{max-width:680px;margin:auto;padding:22px 14px 30px}
header{display:flex;align-items:center;justify-content:center;margin-bottom:18px}
h1{font-size:22px;margin:0;color:#405348;font-weight:500}
.month{display:flex;align-items:center;justify-content:center;gap:18px;margin:0 0 18px}
.month button{border:0;background:transparent;color:#789783;width:34px;height:34px;border-radius:50%;font-size:25px;line-height:1;cursor:pointer}
.month button:active{background:#e5ede5}
.month-name{font-size:18px;font-weight:500;color:#52685a;min-width:155px;text-align:center}
.table-wrap{overflow-x:auto;background:#fff;border:1px solid #dfe7df;border-radius:4px;box-shadow:0 1px 2px rgba(45,70,53,.04)}
table{border-collapse:collapse;width:100%;min-width:520px;table-layout:fixed}
th,td{border-bottom:1px solid #e9eee8;text-align:center;height:49px}
th{font-size:12px;font-weight:500;color:#829287;background:#f8faf6;height:42px}
td:first-child,th:first-child{width:58px}
tr:last-child td{border-bottom:0}
.day{font-size:14px;color:#78897e;font-weight:400}
.check{width:26px;height:26px;border:1px solid #cbd8cc;border-radius:3px;background:#fff;margin:auto;display:flex;align-items:center;justify-content:center;font-size:17px;line-height:1;color:#fff;padding:0;cursor:pointer}
.check.done{background:#789783;border-color:#789783;color:#fff}
.today td{background:#f4f8f2}
.today .day{font-weight:700;color:#456b52}
.hint{text-align:center;color:#91a095;font-size:11px;margin-top:13px}
.footer{display:flex;justify-content:center;margin-top:10px}
.clear{border:0;background:transparent;color:#9b887c;font-size:11px;padding:7px 10px;cursor:pointer}
#install{display:none;position:fixed;bottom:16px;left:50%;transform:translateX(-50%);border:1px solid #d5e0d5;background:#fff;color:#52685a;border-radius:7px;padding:10px 16px;box-shadow:0 2px 10px rgba(45,70,53,.08);font:inherit}
@media(max-width:420px){.app{padding:19px 8px 25px}h1{font-size:21px}.month-name{font-size:17px}}
</style>
</head>
<body>
<div class="app">
<header><h1>متابعة الصلاة</h1></header>
<div class="month">
<button id="prev" aria-label="الشهر السابق">‹</button>
<div class="month-name" id="monthName"></div>
<button id="next" aria-label="الشهر التالي">›</button>
</div>
<div class="table-wrap">
<table>
<thead>
<tr>
<th>اليوم</th>
<th>الفجر</th>
<th>الظهر</th>
<th>العصر</th>
<th>المغرب</th>
<th>العشاء</th>
</tr>
</thead>
<tbody id="rows"></tbody>
</table>
</div>
<div class="hint">اضغطي على المربع لتسجيل الصلاة</div>
<div class="footer"><button class="clear" id="clearMonth">مسح علامات هذا الشهر</button></div>
</div>
<button id="install">تثبيت التطبيق</button>
<script>
const keyPrefix="simple_salah_", prayers=["fajr","dhuhr","asr","maghrib","isha"];
const arMonths=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
let view=new Date();view.setDate(1);

function key(y,m,d,p){
return `${keyPrefix}${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}_${p}`
}

function done(y,m,d,p){
return localStorage.getItem(key(y,m,d,p))==="1"
}

function render(){
const y=view.getFullYear(),m=view.getMonth();
document.getElementById("monthName").textContent=`${arMonths[m]} ${y}`;
const days=new Date(y,m+1,0).getDate(),today=new Date(),rows=document.getElementById("rows");
rows.innerHTML="";

for(let d=1;d<=days;d++){
const tr=document.createElement("tr");
if(today.getFullYear()===y&&today.getMonth()===m&&today.getDate()===d)tr.className="today";

const dc=document.createElement("td");
dc.className="day";
dc.textContent=d;
tr.appendChild(dc);

prayers.forEach(p=>{
const td=document.createElement("td"),b=document.createElement("button");
let v=done(y,m,d,p);
b.className="check"+(v?" done":"");
b.textContent=v?"✓":"";
b.onclick=()=>{
v=!done(y,m,d,p);
localStorage.setItem(key(y,m,d,p),v?"1":"0");
b.className="check"+(v?" done":"");
b.textContent=v?"✓":"";
};
td.appendChild(b);
tr.appendChild(td);
});
rows.appendChild(tr);
}
}

document.getElementById("prev").onclick=()=>{
view.setMonth(view.getMonth()-1);
render();
};

document.getElementById("next").onclick=()=>{
view.setMonth(view.getMonth()+1);
render();
};

document.getElementById("clearMonth").onclick=()=>{
const y=view.getFullYear(),m=view.getMonth(),days=new Date(y,m+1,0).getDate();
if(confirm("مسح كل علامات الصلاة لهذا الشهر؟")){
for(let d=1;d<=days;d++)prayers.forEach(p=>localStorage.removeItem(key(y,m,d,p)));
render();
}
};

render();

let deferredPrompt;
window.addEventListener("beforeinstallprompt",e=>{
e.preventDefault();
deferredPrompt=e;
document.getElementById("install").style.display="block";
});

document.getElementById("install").onclick=async()=>{
if(!deferredPrompt)return;
deferredPrompt.prompt();
await deferredPrompt.userChoice;
deferredPrompt=null;
document.getElementById("install").style.display="none";
};

if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));
</script>
</body>
</html>
